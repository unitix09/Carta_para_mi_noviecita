<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa para ti ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffe6e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Contenedor de corazones de fondo */
    .hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Animación de la caída de corazones */
    .heart-fall {
      position: absolute;
      top: -10%;
      color: #ff4d6d;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    .container {
      position: relative;
      cursor: pointer;
      z-index: 10;
      margin-top: 200px; /* Desplaza el sobre hacia abajo para dejar espacio a la carta */
    }

    /* Sobre de la carta */
    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: #ff758f;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.4s ease;
    }

    .container:hover .envelope {
      transform: translateY(-5px);
    }

    /* Solapa superior del sobre */
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #ff4d6d;
      transform-origin: top;
      transition: transform 0.5s ease 0.3s, z-index 0.2s;
      z-index: 3;
    }

    /* Triángulos laterales del sobre */
    .envelope-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid #ff5977;
      border-right: 150px solid #ff5977;
      border-top: 100px solid transparent;
      border-bottom: 100px solid #ff5977;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      z-index: 3;
    }

    /* Hoja de papel / Carta */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 270px;
      height: 180px;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out;
      z-index: 2;
      overflow: hidden;
    }

    .letter h2 {
      color: #ff4d6d;
      font-size: 18px;
      margin-bottom: 10px;
      text-align: center;
    }

    .letter p {
      color: #4a4a4a;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Sello de corazón */
    .heart-seal {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    /* ESTADO ABIERTO */
    .container.open .envelope::before {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .container.open .letter {
      transform: translateY(-160px); /* Ajustado para salir sin cortar la parte superior */
      height: 300px;
      z-index: 4;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .container.open .heart-seal {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Contenedor para los corazones cayendo -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- Audio de fondo -->
  <audio id="bgMusic" loop>
    <source src="Carla Morrison - Disfruto (letra) - Carla Morrison.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="cardContainer">
    <div class="envelope">
      <div class="heart-seal">❤️</div>
      <div class="letter">
        <h2>Para mi pequeña princesa hermosa 💕</h2>
        <p>
         Holis mi niña, quiero recordarte lo mucho que te amo, gracias por estar siempre conmigo mi niña preciosa, me siento muy afortunado de tenerte en mi vida princesa TE AMO MUCHO MI NIÑA DE OJITOS BONITOS❤️.
          <br><br>
          ¡FELIZ DÍA DE LA NOVIA MI AMOR❤️!
        </p>
      </div>
      <div class="envelope-front"></div>
    </div>
  </div>

  <script>
    const card = document.getElementById('cardContainer');
    const music = document.getElementById('bgMusic');
    const heartsContainer = document.getElementById('heartsContainer');

    card.addEventListener('click', () => {
      card.classList.toggle('open');

      if (card.classList.contains('open')) {
        music.play().catch(e => console.log("Permiso de audio requerido"));
      } else {
        music.pause();
      }
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-fall');
      heart.innerHTML = '❤️';
      
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      heart.style.fontSize = Math.random() * 15 + 10 + 'px';
      
      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
